name: EXE derle
on:
  push:
    paths:
      - app.py
      - icon.ico
      - .github/workflows/build-exe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: python -m pip install flask openpyxl pyinstaller pywebview
      - name: EXE derle
        run: python -m PyInstaller --onefile --noconsole --name AracBakimTakip --icon icon.ico --collect-all webview --clean app.py
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pc --yes --cleanup-tag || true
          gh release create pc dist/AracBakimTakip.exe --title "Bilgisayar surumu" --notes "Windows icin AracBakimTakip.exe"
